<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moi Je Joue – Brigitte Bardot</title>
  <!-- Social preview -->
  <meta property="og:title" content="Moi Je Joue">
  <meta property="og:description" content="Brigitte Bardot">
  <meta property="og:image" content="https://i.scdn.co/image/ab67616d0000b2733e0f1b6c2e0d9b0c6d6c1f2a">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
      text-align: center;
      overflow: hidden;
      background: radial-gradient(circle at top, #222, #000);
    }
    /* Background glow */
    .bg-glow {
      position: fixed;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(29,185,84,0.15), transparent 60%);
      animation: moveGlow 10s linear infinite;
      z-index: 0;
    }
    @keyframes moveGlow {
      0% { transform: translate(-25%, -25%); }
      50% { transform: translate(-10%, -40%); }
      100% { transform: translate(-25%, -25%); }
    }
    .card {
      position: relative;
      z-index: 1;
      max-width: 340px;
      margin: 80px auto;
      background: rgba(20,20,20,0.9);
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      animation: fadeIn 0.8s ease;
    }
    img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    h1 { margin: 10px 0 5px; font-size: 22px; }
    p { opacity: 0.7; margin-bottom: 20px; }
    .btn {
      display: block;
      margin: 12px auto;
      padding: 14px;
      border-radius: 10px;
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }
    .btn:hover {
      box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }
    .btn:active {
      transform: scale(0.96);
    }
    .spotify { background: #1DB954; }
    .youtube { background: #FF0000; }
    .hint {
      font-size: 12px;
      opacity: 0.5;
      margin-top: 15px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px);}
      to { opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
<div class="bg-glow"></div>
<div class="card">
  <img src="https://i.scdn.co/image/ab67616d0000b2733e0f1b6c2e0d9b0c6d6c1f2a" alt="Artwork">
  <h1>Moi Je Joue</h1>
  <p>Brigitte Bardot</p>
  <a class="btn spotify" id="spotifyBtn" href="spotify:track:5aWppKqMap0ReWQD8uXCLh">
    ▶️ Open in Spotify
  </a>
  <a class="btn youtube" href="https://www.youtube.com/watch?v=0O3p6yF3XnQ">
    📺 Bekijk video
  </a>
  <div class="hint">Werkt autoplay niet? Tik op een knop 👆</div>
</div>
<script>
  // Device detectie
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const isAndroid = /Android/i.test(navigator.userAgent);
  // Vibratie (Android)
  function vibrate() {
    if (navigator.vibrate) {
      navigator.vibrate(50);
    }
  }
  document.getElementById("spotifyBtn").addEventListener("click", vibrate);
  // Slimme auto-open poging
  setTimeout(() => {
    if (isAndroid) {
      window.location.href = "spotify:track:5aWppKqMap0ReWQD8uXCLh";
    }
  }, 700);
</script>
</body>
</html>
